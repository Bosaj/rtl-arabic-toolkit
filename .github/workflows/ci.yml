name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for the mirror-check tests
        run: npx playwright install --with-deps chromium
      - name: Test, including the real-browser mirror check
        run: |
          export CHROME="$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")"
          npm test
      - name: The toolkit passes its own audit
        run: npm run audit:self
